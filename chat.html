<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a0713">
<title>LYNKO CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://js.pusher.com" crossorigin><script async id="pjs" src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<style>
:root{--rose:#ff5c8a;--peach:#ffb38a;--lilac:#b28cff;--txt:#fff0f5;--mut:#d6a6ba;--line:rgba(255,255,255,.12);--panel:#240b1d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0}
body{font-family:'DM Sans','Noto Sans Sinhala',system-ui,sans-serif;color:var(--txt);overflow:hidden;background:#1a0713}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea{font:16px 'DM Sans','Noto Sans Sinhala',sans-serif;color:var(--txt);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;min-width:0}
input:focus{border-color:var(--rose)}
::placeholder{color:#b98aa0}
.app{position:relative;width:100%;height:100%;height:100vh;height:100dvh;height:calc(var(--vh,1vh)*100);overflow:hidden;display:grid;grid-template-columns:370px 1fr;grid-template-rows:minmax(0,1fr)}
.side,.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.side{background:#1d0817;border-right:1px solid var(--line)}
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.lg{flex:1;font:italic 600 30px 'Fraunces',serif;background:linear-gradient(120deg,var(--peach),var(--rose) 55%,var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:6px}
.lg i{font-style:normal;display:inline-block;animation:beat 1.4s infinite;-webkit-text-fill-color:var(--rose)}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.25)}28%{transform:scale(1)}42%{transform:scale(1.15)}}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.ic:active,.item:active{background:rgba(255,255,255,.1)}
.meb{width:40px;height:40px;padding:0}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;overflow:hidden;background:linear-gradient(135deg,var(--peach),var(--rose) 60%,var(--lilac));color:#3a0a24}
.av img{width:100%;height:100%;object-fit:cover}
.meb .av,.sm .av{width:38px;height:38px;font-size:16px}
.srch{flex:none;padding:0 12px 8px}.srch input::-webkit-search-decoration{display:none}.srch input{width:100%;border-radius:99px;padding:11px 18px;background:rgba(255,255,255,.08)}
.chips{flex:none;display:flex;gap:8px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.08);font-size:14px;color:var(--mut);border:1px solid transparent}
.chips button.on{background:rgba(255,92,138,.22);color:var(--txt);border-color:var(--rose)}
.list{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.nav{display:flex;flex:none;border-top:1px solid var(--line);background:#1d0817;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--mut)}
.nav i{font-style:normal;font-size:21px;padding:2px 20px;border-radius:99px}.nav .on{color:var(--txt);font-weight:700}.nav .on i{background:rgba(255,92,138,.25)}
.hero{padding:40px 24px;text-align:center;display:grid;gap:14px;justify-items:center}
.hero>i{font-style:normal;font-size:70px;animation:beat 1.4s infinite;filter:drop-shadow(0 0 16px var(--rose))}
.hero h2{font:italic 600 28px 'Fraunces',serif}.hero p{color:var(--mut);line-height:1.6;max-width:300px}.hero .idbox{max-width:300px}.hero .btn{max-width:300px;flex:none;width:100%}
.item{width:100%;display:flex;align-items:center;gap:13px;padding:10px 14px;text-align:left}
.item.on{background:rgba(255,255,255,.08)}
.item .n{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:6px 0 10px}
.r1,.r2{display:flex;align-items:center;gap:8px}
.r1 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px}
.r1 time{font-size:12px;color:var(--mut)}
.r2{margin-top:3px}.pv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:14.5px}
.pv.ty{color:var(--rose)}
.badge{background:var(--rose);color:#2a0618;font-weight:700;font-size:12px;min-width:21px;height:21px;border-radius:99px;display:grid;place-items:center;padding:0 6px;font-style:normal}
.badge:empty{display:none}
.empty{padding:50px 24px;text-align:center;color:var(--mut);line-height:1.7}
.add{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:300;line-height:1;padding-bottom:2px;margin-right:2px;background:linear-gradient(135deg,var(--rose),#c14bff);box-shadow:0 6px 20px rgba(255,92,138,.5)}
.add:active{transform:scale(.94)}
.vf{display:inline-block;width:17px;height:17px;vertical-align:-3px;margin-left:5px;flex:none}
.tag{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:99px;background:#2f9bff;color:#fff;margin-left:7px;vertical-align:2px}
.tx a{color:#7fe3ff;word-break:break-all}
.main{--wp:radial-gradient(900px 700px at 10% 0%,#4a0d33,transparent 60%),#1a0713;background:#1a0713}
.none{flex:1;display:grid;place-items:center;text-align:center;color:var(--mut);padding:30px;background:var(--wp)}
.none i{display:block;font-style:normal;font-size:70px;animation:beat 1.4s infinite;filter:drop-shadow(0 0 18px var(--rose))}
.head{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:#2a0f22;border-bottom:1px solid var(--line);z-index:2}
.head .t{flex:1;min-width:0}.head .t div{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head small.ty{color:var(--rose);font-weight:700}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 10px 18px;display:flex;flex-direction:column;gap:3px;background:var(--wp);overscroll-behavior:contain}
.sys{align-self:center;font-size:12.5px;color:var(--mut);background:rgba(20,5,15,.7);padding:5px 12px;border-radius:99px;margin:8px 0}
.row{display:flex;animation:pop .18s ease-out}.row.me{justify-content:flex-end}
.row:has(.rxp:not([hidden])){margin-bottom:13px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.b{position:relative;max-width:min(80%,480px);padding:7px 10px 5px;border-radius:16px;line-height:1.38;font-size:16px;-webkit-touch-callout:none;word-break:break-word}
.them .b{background:#3a1a30;border-top-left-radius:4px}
.me .b{background:linear-gradient(135deg,#d8366f,#8d3bd6);border-top-right-radius:4px}
.tx{white-space:pre-wrap}
.meta{float:right;margin:6px 0 -2px 10px;font-size:11px;opacity:.75;display:flex;gap:4px;align-items:center}
.tk.rd{color:#7fe3ff;opacity:1}
.b.med{padding:3px 3px 5px}.b.med .tx{padding:5px 7px 0}.b.med .meta{margin-right:6px}
.b.jumbo{background:none!important;padding:0;font-size:48px;line-height:1.15}.jumbo .meta{font-size:11px}
.rxp{position:absolute;bottom:-13px;right:8px;background:#2a0f22;border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:13px}
.mb{position:relative;width:min(70vw,290px);max-height:380px;border-radius:13px;overflow:hidden;background:#0005}
.mb img,.mb video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.mb .th{filter:blur(10px);transform:scale(1.15)}.mb.ok .th{display:none}
.mb .full{opacity:0;transition:opacity .25s}.mb.ok .full{opacity:1}
.sp{display:none;position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;width:34px;height:34px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.mb.ld .sp{display:block}@keyframes spin{to{transform:rotate(360deg)}}
.play{position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;width:54px;height:54px;border-radius:50%;background:#0008;display:grid;place-items:center;font-size:22px}
.dur{position:absolute;left:8px;bottom:6px;font-size:12px;background:#0007;padding:2px 7px;border-radius:99px}
.mb.ok .play,.mb.ld .play,.mb.ok .dur,.mb.bad .play{display:none}
.mb.bad::after{content:'Tap to retry';position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;background:#0008;font-size:13px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#1d0817}
.pill{flex:1;display:flex;align-items:flex-end;background:#33152a;border-radius:24px;border:1px solid var(--line)}
.pill textarea{flex:1;border:0;background:none;resize:none;max-height:120px;padding:12px 6px;line-height:1.3;border-radius:0}
.ib{width:44px;height:46px;font-size:21px;flex:none}
.send{width:48px;height:48px;border-radius:50%;font-size:20px;flex:none;background:linear-gradient(135deg,var(--rose),#c14bff);box-shadow:0 6px 18px rgba(255,92,138,.4)}
.attm{position:absolute;left:10px;bottom:70px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;gap:14px}
.attm button{display:grid;gap:4px;justify-items:center;font-size:26px;padding:8px 12px;border-radius:14px}.attm span{font-size:12px;color:var(--mut)}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(10,2,8,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
.ov.sh{align-items:end;padding:0}
.dlg{width:100%;max-width:340px;padding:22px;border-radius:24px;background:var(--panel);border:1px solid var(--line);text-align:center}
.sh .dlg{max-width:520px;border-radius:26px 26px 0 0;padding:20px 20px max(28px,calc(20px + env(safe-area-inset-bottom)));text-align:left;max-height:88vh;max-height:88dvh;overflow:auto}
.dlg h3{margin-bottom:14px}.dlg input.pin{width:100%;text-align:center;font-size:24px;letter-spacing:8px}
.dlg .r{display:flex;gap:10px;margin-top:14px}.dlg .r button,.btn{flex:1;padding:13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:700}
.dlg .r .ok,.btn.p{background:linear-gradient(135deg,var(--rose),#c14bff)}
.mi{width:100%;text-align:left;padding:15px 8px;font-size:16.5px;border-bottom:1px solid var(--line)}
.mn{width:100%;max-width:340px}.emo{display:flex;justify-content:space-between;background:var(--panel);border-radius:99px;padding:8px 10px;margin-bottom:10px}.emo button{font-size:28px;padding:2px 5px}
.mn .act{background:var(--panel);border-radius:18px;overflow:hidden}
.pf{display:grid;gap:12px;justify-items:center}.pf .big{width:130px;height:130px;font-size:52px;cursor:pointer;position:relative}.pf label{justify-self:start;color:var(--mut);font-size:13px}
.pf input{width:100%}.idbox{width:100%;text-align:center;padding:12px;border-radius:14px;border:1px dashed rgba(255,92,138,.6);background:rgba(255,92,138,.1);color:var(--mut)}.idbox b{display:block;font-size:24px;letter-spacing:3px;color:var(--txt)}
.wg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.wg button{aspect-ratio:3/4;border-radius:14px;border:2px solid var(--line);font-size:11px;display:grid;align-items:end;padding:5px;text-shadow:0 1px 3px #000}
.wg button.on{border-color:var(--rose)}
.pvw{display:flex;flex-direction:column;place-items:initial;padding:0;background:#0c0309;inset:auto;top:0;left:0;width:100%;height:100vh;height:100dvh;overflow:hidden}
.pvw .x,.tst .x{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:3;width:42px;height:42px;border-radius:50%;background:#0008;font-size:18px}
/* media is pinned inside its box, so a tall video can never push the caption/send bar off screen */
.pvw .st{position:relative;flex:1 1 0;min-height:0;overflow:hidden;margin-top:calc(56px + env(safe-area-inset-top))}
.pvw .st img,.pvw .st video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain}
.cb{flex:none;position:relative;z-index:3;display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#1d0817}.cb input{flex:1;border-radius:24px}
.lb{background:#000;padding:0}.lb img{max-width:100%;max-height:100%;object-fit:contain}
.nav button{position:relative}.nav .dot{position:absolute;top:6px;left:calc(50% + 12px);width:10px;height:10px;border-radius:50%;background:var(--rose);border:2px solid #1d0817;font-style:normal}
.sec{padding:14px 16px 4px;color:var(--mut);font-size:13px;font-weight:700}
.ring{position:relative;padding:3px;border-radius:50%;background:#5b3a50;flex:none}
.ring.un,.ring.mine{background:linear-gradient(135deg,var(--peach),var(--rose) 55%,var(--lilac))}.ring.none{background:none}
.ring .av{border:2px solid #1d0817;box-sizing:content-box}
.ring .plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--rose),#c14bff);display:grid;place-items:center;font-weight:700;border:2px solid #1d0817;font-size:15px;line-height:1}
.qt{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.25);border-left:3px solid var(--peach);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:13.5px;overflow:hidden}
.qt img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none}.qt>div{min-width:0}
.qt b{display:block;color:var(--peach);font-size:12.5px}.qt span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.sv{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;z-index:40;background:#000;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
.spg{display:flex;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 10px 0;z-index:3;flex:none}
.spg i{flex:1;height:3px;border-radius:3px;background:#fff4;overflow:hidden}.spg b{display:block;height:100%;width:0;background:#fff}
.shd{display:flex;align-items:center;gap:10px;padding:10px;z-index:3;flex:none}
.shd .who .av{width:40px;height:40px;font-size:16px}
.shd .tm{flex:1;min-width:0}.shd .tm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shd .tm small{color:#fffc;font-size:12.5px}
.shd button{width:40px;height:40px;border-radius:50%;font-size:18px;flex:none}
.scn{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
.scn .cont{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center}
.scn .cont img,.scn .cont video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain}
.scn .cont.txt{padding:28px;text-align:center;font:600 30px/1.3 'DM Sans',sans-serif;white-space:pre-wrap;word-break:break-word;overflow:auto}
.scn .ssp{position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;width:38px;height:38px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.scap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 14px;text-align:center;background:linear-gradient(transparent,#000b);font-size:16px;white-space:pre-wrap;word-break:break-word;pointer-events:none}
.sft{flex:none;z-index:3;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#000}
.sft .rp{display:flex;gap:8px}.sft .rp input{flex:1;border-radius:24px}.sft .hb{width:48px;height:48px;font-size:26px;flex:none}
.vws{width:100%;padding:13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:700}
.vr{display:flex;justify-content:space-between;gap:10px;padding:13px 6px;border-bottom:1px solid var(--line)}.vr small{color:var(--mut)}
.tst{display:grid;place-items:center;padding:0;inset:auto;top:0;left:0;width:100%;height:100vh;height:100dvh;background:#c14bff}
.tst textarea{width:100%;max-width:520px;height:55%;background:none;border:0;text-align:center;font:600 30px/1.3 'DM Sans',sans-serif;resize:none;color:#fff;padding:20px}
.tst textarea::placeholder{color:#fff9}
.tst .pal{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;width:42px;height:42px;border-radius:50%;background:#0006;font-size:20px}
.tst .send{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
.bh{position:fixed;z-index:90;pointer-events:none;font-size:22px;animation:bh 1.4s ease-out forwards}
@keyframes bh{to{transform:translate(var(--dx),var(--dy)) scale(var(--s));opacity:0}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:99;background:#000d;padding:10px 18px;border-radius:99px;font-size:14px}
@media (max-width:760px),(hover:none) and (pointer:coarse){
 .app{grid-template-columns:minmax(0,1fr)}
 .sh .dlg{max-width:none;border-radius:24px 24px 0 0}
 .b{max-width:84%}
 .main{position:absolute;top:0;right:0;bottom:0;left:0;transform:translateX(100%);transition:transform .22s}
 .app.chatting .main{transform:none}
 .back{display:grid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* voice messages */
.vn{position:relative;display:flex;align-items:center;gap:10px;min-width:220px;padding:3px 2px 1px}
.vp{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);font-size:15px;flex:none;display:grid;place-items:center}
.vp:active{background:rgba(255,255,255,.35)}
.vbar{flex:1;height:22px;position:relative;cursor:pointer;touch-action:none}
.vbar::before{content:'';position:absolute;left:0;right:0;top:9px;height:4px;border-radius:99px;background:rgba(255,255,255,.28)}
.vfill{position:absolute;left:0;top:9px;height:4px;width:0;border-radius:99px;background:#fff}
.vfill::after{content:'';position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff}
.vt{font-size:12px;opacity:.9;min-width:38px;text-align:right;font-variant-numeric:tabular-nums;cursor:pointer}
.vn .sp{display:none;width:18px;height:18px;border-width:2px;left:auto;right:46px;top:0;bottom:0}.vn.ld .sp{display:block}.vn.bad .vp{background:rgba(255,80,80,.5)}
.rec{display:flex;align-items:center;gap:10px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#1d0817}
.rec .rd{width:11px;height:11px;border-radius:50%;background:#ff3b30;animation:beat 1s infinite;margin-left:8px;flex:none}
.rec .rt{font-size:18px;font-variant-numeric:tabular-nums}.rec .rh{flex:1;color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .ic{flex:none}

/* ── calls / notifications / AI ── */
.callov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:radial-gradient(900px 700px at 50% 0%,#5a1246,#14040f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px;text-align:center}
.callov[hidden],.nbar[hidden],.ic[hidden],.ib[hidden]{display:none!important}
.callov .cav .av{width:128px;height:128px;font-size:52px}
.callov h2{font:italic 600 30px 'Fraunces',serif;margin-top:14px}
.callov p{color:var(--mut);font-size:17px;min-height:24px}
.cbt{display:flex;gap:52px;margin:56px 0 30px}
.cbn{width:72px;height:72px;border-radius:50%;font-size:28px;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.14)}
.cbn small{position:absolute;top:80px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;color:var(--mut)}
.cbn.ok{background:#22c55e}.cbn.no{background:#ef4444}.cbn.mu.on{background:#fff;color:#14040f}

<script>
const $=id=>document.getElementById(id), enc=new TextEncoder(), dec=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>{let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)};
async function api(url,method='GET',body){
  const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(r.status==401){leave();throw new Error('auth')}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function leave(){['lynko_priv','lynko_enc'].forEach(k=>localStorage.removeItem(k));sessionStorage.removeItem('lynko_priv');(window.caches?caches.delete('lynko-api-v2'):Promise.resolve()).catch(()=>{}).finally(()=>{location.href='/'})}

let me,priv,cur=null,contacts=new Map(),chats=new Map(),msgs=[],seen=new Set(),keys={},urls={},pl=new Map(),unlocked=new Set(),lastDay='',tc=0,typingT={},lastTy=0;
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dayLbl=t=>{const d=new Date(t),n=new Date(),y=new Date(n-864e5);return d.toDateString()==n.toDateString()?'Today':d.toDateString()==y.toDateString()?'Yesterday':d.toLocaleDateString()};
const av=(c,cls='')=>`<div class="av ${cls}">${c.dpv?`<img src="/api/dp/${c.id}?v=${c.dpv}" alt="">`:(c.username||'?')[0].toUpperCase()}</div>`;
const lk=id=>`lk:${me.id}:${id}`;
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));

// ── crypto (ECDH → AES-GCM, keys cached per friend) ──
async function shared(id){
  if(keys[id])return keys[id];
  const pub=await crypto.subtle.importKey('jwk',JSON.parse((id==me.id?me:contacts.get(id)).pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  return keys[id]=await crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(id,data){const iv=crypto.getRandomValues(new Uint8Array(12));
  return {iv:b64(iv),ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},await shared(id),data)}}
const open=async(id,iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},await shared(id),ct);
async function payload(m){
  if(pl.has(m.id))return pl.get(m.id);
  const peer=m.from==me.id?m.to:m.from;let p;
  try{p=JSON.parse(dec.decode(await open(peer,m.iv,unb64(m.ct))))}catch{p={k:'text',v:'🔒 Couldn’t decrypt this message'}}
  pl.set(m.id,p);return p}

// ── dialogs ──
function ask(title,{pin=false,ok='OK'}={}){return new Promise(res=>{
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="dlg"><h3></h3>${pin?'<input class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">':''}<div class="r"><button class="no">Cancel</button><button class="ok">${ok}</button></div></div>`;
  o.querySelector('h3').textContent=title;document.body.appendChild(o);
  const i=o.querySelector('input');i&&i.focus();const done=v=>{o.remove();res(v)};
  o.querySelector('.no').onclick=()=>done(null);o.querySelector('.ok').onclick=()=>done(pin?i.value:true);
  i&&i.addEventListener('keydown',e=>{if(e.key=='Enter')done(i.value)});})}
function sheet(html){const o=document.createElement('div');o.className='ov sh';o.innerHTML='<div class="dlg">'+html+'</div>';
  o.onclick=e=>{if(e.target==o)o.remove()};document.body.appendChild(o);return o}
function items(list){const o=sheet(list.map((x,i)=>`<button class="mi" data-i="${i}">${x[0]}</button>`).join(''));
  o.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{o.remove();list[b.dataset.i][1]()})}

// ── hearts ──
function burst(x=innerWidth/2,y=innerHeight*.72){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<14;i++){const h=document.createElement('span');h.className='bh';h.textContent=['❤️','💕','💖','💗'][i%4];
    h.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*240}px;--dy:${-120-Math.random()*240}px;--s:${.7+Math.random()}`;
    document.body.appendChild(h);setTimeout(()=>h.remove(),1500)}}
const love=p=>p.k=='text'&&/❤|♥|💕|💖|💗|😍|🥰|😘|love you|i love u|luv u|\bluv\b/i.test(p.v);
const jumbo=v=>/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(v)&&[...v.matchAll(/\p{Extended_Pictographic}/gu)].length<=3;
setInterval(()=>{if(document.hidden)return;const h=document.createElement('div');h.className='bh';h.textContent='♥';
  h.style.cssText=`left:${Math.random()*100}vw;top:105vh;font-size:${10+Math.random()*16}px;color:${['#ff5c8a','#ffb38a','#b28cff'][Math.random()*3|0]};opacity:.35;--dx:${(Math.random()-.5)*60}px;--dy:-115vh;--s:1.2;animation-duration:${9+Math.random()*6}s;z-index:0`;
  document.body.appendChild(h);setTimeout(()=>h.remove(),15000)},1800);

// ── wallpaper ──
const HEART="url(\"data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><text x='8' y='32' font-size='22' fill='#ff5c8a' fill-opacity='.16'>♥</text><text x='52' y='76' font-size='15' fill='#b28cff' fill-opacity='.16'>♥</text></svg>")+"\") ,#1d0817";
const WP=[['Default',''],['Rose','linear-gradient(160deg,#3b0b2c,#8a1650)'],['Sunset','linear-gradient(170deg,#2a0f3d,#b53a6a 60%,#e8845f)'],['Wine','linear-gradient(160deg,#1f040f,#5c0f2a)'],['Dusk','linear-gradient(160deg,#0f0a2b,#4a1d7a)'],['Ocean','linear-gradient(160deg,#071a30,#5a2a7a)'],['Night','#0b0508'],['Hearts',HEART]];
function applyWp(){let w;try{w=JSON.parse(localStorage.getItem('wp')||'null')}catch{}
  const v=!w?'':w.t=='img'?`linear-gradient(#0007,#0007),url(${w.v}) center/cover`:w.v;
  v?document.documentElement.style.setProperty('--wp',v):document.documentElement.style.removeProperty('--wp');
  document.querySelector('.main').style.setProperty('--wp',v||'radial-gradient(900px 700px at 10% 0%,#4a0d33,transparent 60%),#1a0713')}
function wallpaper(){
  const o=sheet(`<h3 style="margin-bottom:6px">Wallpaper</h3><div class="wg">${WP.map((w,i)=>`<button data-i="${i}" style="background:${w[1]||'#1a0713'}">${w[0]}</button>`).join('')}</div><button class="btn p" style="width:100%" id="wpg">Choose from gallery</button><input type="file" id="wpf" accept="image/*" hidden>`);
  o.querySelectorAll('.wg button').forEach(b=>b.onclick=()=>{const w=WP[b.dataset.i];w[1]?localStorage.setItem('wp',JSON.stringify({t:'css',v:w[1]})):localStorage.removeItem('wp');applyWp();o.remove()});
  o.querySelector('#wpg').onclick=()=>o.querySelector('#wpf').click();
  o.querySelector('#wpf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const bm=await createImageBitmap(f),s=Math.min(1,1080/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*s;c.height=bm.height*s;
      c.getContext('2d').drawImage(bm,0,0,c.width,c.height);localStorage.setItem('wp',JSON.stringify({t:'img',v:c.toDataURL('image/jpeg',.6)}));applyWp();o.remove()}
    catch{toast('Photo too big for wallpaper')}}}

// ── profile (DP + about) ──
function profile(){
  let dp=null;
  const o=sheet(`<div class="pf"><label class="av big" id="pdp" style="margin:auto"></label><input type="file" id="pfile" accept="image/*" hidden><small style="color:var(--mut)">Tap the photo to change it</small>${me.phone?`<small style="color:var(--mut)">+${me.phone}</small>`:''}<label>About</label><input id="pab" maxlength="120" placeholder="Hey there! I’m using Lynko"><div class="idbox">Your ID — tap to copy<b>${me.id}</b></div><label class="tg"><span>Hide my last seen &amp; online<small>If hidden, you can’t see others’ either</small></span><input type="checkbox" id="phs"></label>${F.cfgAi()?'<label class="tg"><span>Lynko AI ✨<small>AI assistant chat · not end-to-end encrypted</small></span><input type="checkbox" id="pai"></label>':''}<label class="tg"><span>Ask password<small>after leaving the app</small></span><select id="pla"><option value="now">Right away</option><option value="1m">After 1 minute</option><option value="10m">After 10 minutes</option></select></label><button class="btn" style="width:100%" id="ppin">🔒 Reset chat-lock secret code</button><button class="btn" style="width:100%" id="pnt">🔔 Message &amp; call notifications</button><button class="btn p" style="width:100%" id="psv">Save</button></div>`);
  const paint=()=>{const e=o.querySelector('#pdp');e.innerHTML=dp?`<img src="data:image/jpeg;base64,${dp}">`:me.dpv?`<img src="/api/dp/${me.id}?v=${me.dpv}">`:me.username[0].toUpperCase()};paint();
  o.querySelector('#pab').value=me.about||'';o.querySelector('#phs').checked=!!me.hideSeen;const pai=o.querySelector('#pai');if(pai)pai.checked=F.aiOn();o.querySelector('#pnt').onclick=F.notifOn;o.querySelector('#pla').value=LOCK.after();o.querySelector('#pla').onchange=e=>LOCK.setAfter(e.target.value);o.querySelector('#ppin').onclick=()=>{o.remove();LOCK.chat.resetPin()};
  o.querySelector('#pdp').onclick=()=>o.querySelector('#pfile').click();
  o.querySelector('.idbox').onclick=()=>{navigator.clipboard?.writeText(me.id);toast('ID copied')};
  o.querySelector('#pfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const bm=await createImageBitmap(f),s=Math.min(bm.width,bm.height),c=document.createElement('canvas');
    c.width=c.height=256;c.getContext('2d').drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,256,256);dp=c.toDataURL('image/jpeg',.8).split(',')[1];paint()};
  o.querySelector('#psv').onclick=async()=>{try{const hs=o.querySelector('#phs').checked,r=await api('/api/profile','POST',{about:o.querySelector('#pab').value,dp,hideSeen:hs});me.about=r.about;me.dpv=r.dpv;me.hideSeen=hs;if(pai)F.aiToggle(pai.checked);paintMe();o.remove();toast('Saved ♥')}catch(e){toast(e.message)}}}
const NK={all(){try{return JSON.parse(localStorage.getItem('lk_nick')||'{}')}catch{return{}}},set(id,n){const a=this.all();n?a[id]=n:delete a[id];try{localStorage.setItem('lk_nick',JSON.stringify(a))}catch{}}};
function nick(c){if(c){if(c.orig==null)c.orig=c.username;c.username=NK.all()[c.id]||c.orig}return c}
function renameContact(id){const c=contacts.get(id);if(!c)return;
  const o=sheet(`<div class="pf"><h3 style="margin:0">Rename contact</h3><small style="color:var(--mut)">Only you see this name. Original: <span id="rno"></span></small><input id="rni" maxlength="30" placeholder="Name"><button class="btn p" style="width:100%" id="rns">Save</button><button class="btn" style="width:100%" id="rnr">Use original name</button></div>`);
  o.querySelector('#rno').textContent=c.orig;const i=o.querySelector('#rni');i.value=c.username;setTimeout(()=>i.focus(),50);
  const done=n=>{NK.set(id,n);nick(c);o.remove();if(cur==id)$('hn').textContent=c.username;renderList();toast('Saved ♥')};
  o.querySelector('#rns').onclick=()=>{const n=i.value.trim();done(n&&n!==c.orig?n:'')};o.querySelector('#rnr').onclick=()=>done('');i.addEventListener('keydown',e=>{if(e.key=='Enter')o.querySelector('#rns').click()})}
function addContact(){
  const o=sheet(`<div class="pf"><h3 style="margin:0">Add contact</h3><input id="nid" placeholder="Friend’s phone number or 8-digit ID" inputmode="tel" autocomplete="off"><input id="nnm" maxlength="30" placeholder="Save as (optional name)" autocomplete="off"><button class="btn p" style="width:100%" id="ngo">Add contact</button><div class="idbox">Your ID — tap to copy<b>${me.id}</b></div></div>`);
  const inp=o.querySelector('#nid');setTimeout(()=>inp.focus(),50);
  o.querySelector('.idbox').onclick=()=>{navigator.clipboard?.writeText(me.id);toast('ID copied')};
  const go=async()=>{const id=inp.value.trim();if(!/\d{6,}/.test(id))return toast('Enter a phone number or 8-digit ID');
    try{const had=contacts.has(id),p=await api('/api/contacts','POST',{id});const sn=o.querySelector('#nnm').value.trim();if(sn)NK.set(p.id,sn);contacts.set(p.id,nick(p));o.remove();toast(had?'Already in your contacts':'Contact added ♥');openChat(p.id)}catch(e){toast(e.message)}};
  o.querySelector('#ngo').onclick=go;inp.addEventListener('keydown',e=>{if(e.key=='Enter')go()})}

const sSw=(ic,bg,t,k,{sub='',on=false,dis=false}={})=>`<label class="sr"><span class="si" style="background:${bg}">${ic}</span><span class="st">${t}${sub?`<small>${sub}</small>`:''}</span><input type="checkbox" class="ios" data-k="${k}"${on?' checked':''}${dis?' disabled':''}></label>`;
let setPg='main';
const isInstalled=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||/LynkoApp/.test(navigator.userAgent);
const CALLNOTE='🔐 Voice calls are end-to-end encrypted. The call setup is sealed with your chat keys, so not even the Lynko server can read it or swap it, and the audio is encrypted phone-to-phone.';
function setHtml(){
  const top=(back)=>`<div class="stb">${back?'<button data-a="back">‹ Settings</button>':'<span></span>'}<button data-a="done">Done</button></div>`;
  if(setPg=='lock'){
    const has=LOCK.chat.hasCode(),n=LOCK.chat.count();
    return top(1)+'<h1>Chat lock</h1>'
      +sGrp(sRow('🔑','#7f5cff',has?'Change secret code':'Set up secret code',{a:'code',val:has?'On':'Off'}),'Lock any chat from its ⋮ menu. A locked chat disappears from your chat list and from search.')
      +(has?sGrp(sSw('🙈','#5856d6','Hide Locked chats','hide',{on:LOCK.chat.hidden(),sub:'The folder shows up only after you type your secret code in the search bar'})
        +sRow('🔒','#ff5c8a','Open Locked chats',{a:'openlk',val:n+(n==1?' chat':' chats')}),'To open them: go to Chats and type your secret code in the search bar.')
        +sGrp(sRow('🗑','#ff3b30','Remove chat lock',{a:'rmlock',red:1,chev:0}),'This unlocks every locked chat. Needs your account password.'):'');
  }
  const ns=F.notifState(),nv=ns=='granted'?'On':ns=='denied'?'Blocked':ns=='unsupported'?'Not supported':'Off';
  const rs=F.relayState();   // null = still checking, false = server has no relay, true = available
  return top(0)+'<h1>Settings</h1>'
    +`<div class="sg"><button class="sr prof" data-a="profile"><span id="spav"></span><span class="st"><b id="spn"></b><small id="spa"></small></span></button></div><div style="height:12px"></div>`
    +sGrp(sRow('🔒','#ff5c8a','Chat lock',{a:'lock',val:LOCK.chat.hasCode()?'On':'Off'})
      +sSw('👁','#34c759','Hide last seen &amp; online','seen',{on:!!me.hideSeen,sub:'If hidden, you can’t see others’ either'})
      +`<label class="sr"><span class="si" style="background:#ff9f0a">⏱</span><span class="st">Lock app</span><select data-k="after"><option value="now">Right away</option><option value="1m">After 1 minute</option><option value="10m">After 10 minutes</option></select></label>`
      +sSw('🫥','#5856d6','Hide app preview','shield',{on:LOCK.shield.get(),sub:'Blank screen in the app switcher'}),
      'Your password is asked again whenever you come back to the app.')
    +(rs===true?sGrp(sSw('🛡','#0a84ff','Protect IP address in calls','relay',{on:F.relayGet(),sub:'Relays calls through Lynko so your IP stays hidden'}),CALLNOTE):`<div class="sf">${CALLNOTE}</div>`)   // row only appears when the server really has a relay (no more \"not available\" error text)
    +(isInstalled()?'':sGrp(sRow('📲','#0a84ff','Install app',{a:'install',sub:'Add LYNKO CHAT to your home screen — opens like a normal app'})))
    +sGrp(sRow('🔔','#ff3b30','Notifications',{a:'notif',val:nv})
      +sRow('🖼','#32ade6','Wallpaper',{a:'wall'})
      +(F.cfgAi()?sSw('✨','#af52de','Lynko AI','ai',{on:F.aiOn(),sub:'Not end-to-end encrypted'}):'')
      +sRow('➕','#34c759','Add contact',{a:'add'}))
    +((/android/i.test(navigator.userAgent)&&!isInstalled())?sGrp(sRow('📥','#34c759','Download Android app (APK)',{a:'apk',sub:'Real app — updates itself when the site updates'})):'')
    +sGrp(sRow('🆘','#ff9f0a','Help center',{a:'help',sub:'Ask the assistant how to use Lynko'})+sRow('📄','#8e8e93','Terms of Service',{a:'terms'})+sRow('🔐','#8e8e93','Privacy Policy',{a:'privacy'}))
    +sGrp(sRow('🆔','#8e8e93','My ID',{a:'id',val:me.id,chev:0})+sRow('⎋','#ff3b30','Log out',{a:'logout',red:1,chev:0}),'Lynko ♥ · everything vanishes after 24 hours · messages are end-to-end encrypted')
}
function settings(pg){
  setPg=pg||'main';let o=$('setov');
  if(!o){o=document.createElement('div');o.id='setov';o.className='setov';document.body.appendChild(o);o.addEventListener('click',onSetClick);o.addEventListener('change',onSetChange);history.pushState({set:1},'')}   // phone Back button closes Settings
  const y=o.scrollTop;o.innerHTML=setHtml();o.scrollTop=pg?0:y;
  const sel=o.querySelector('select[data-k=after]');if(sel)sel.value=LOCK.after();
  if(o.querySelector('.prof')){$('spav').innerHTML=av(me);$('spn').textContent=me.username;$('spa').textContent=me.about||(me.phone?'+'+me.phone:'Hey there! I’m using Lynko')}
  if(setPg=='main'&&F.relayState()===null)F.relayAvail().then(()=>{if($('setov')&&setPg=='main')settings()})}
async function onSetClick(e){
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,o=$('setov');
  if(a=='done')history.back();
  else if(a=='back')settings('main');
  else if(a=='lock')settings('lock');
  else if(a=='profile')profile();
  else if(a=='code'){await(LOCK.chat.hasCode()?LOCK.chat.resetPin():LOCK.chat.setup());if($('setov'))settings('lock')}
  else if(a=='openlk'){if(await LOCK.chat.gate()){o.remove();openLocked()}}
  else if(a=='rmlock'){if(confirm('Remove chat lock? All locked chats become normal chats again.')){await LOCK.chat.removeCode();if($('setov'))settings('lock')}}
  else if(a=='notif'){await F.notifOn();if($('setov'))settings(setPg)}
  else if(a=='install'){if(window.lynkoInstall)lynkoInstall();else toast('Open the browser menu → Install app')}
  else if(a=='wall')wallpaper();
  else if(a=='apk'){if(window.lynkoInstall)lynkoInstall()}
  else if(a=='help')LX.help();
  else if(a=='terms'||a=='privacy')LX.legal(a);
  else if(a=='add'){o.remove();addContact()}
  else if(a=='id'){navigator.clipboard?.writeText(me.id);toast('ID copied')}
  else if(a=='logout'){if(confirm('Log out of this phone?')){await fetch('/api/logout',{method:'POST'});leave()}}}
async function onSetChange(e){
  const t=e.target,k=t.dataset.k;if(!k)return;
  if(k=='seen'){try{await api('/api/profile','POST',{hideSeen:t.checked});me.hideSeen=t.checked;toast(t.checked?'Last seen hidden':'Last seen visible')}catch(x){t.checked=!t.checked;toast(x.message)}}
  else if(k=='shield')LOCK.shield.set(t.checked);
  else if(k=='relay')F.relaySet(t.checked);
  else if(k=='ai')F.aiToggle(t.checked);
  else if(k=='after')LOCK.setAfter(t.value);
  else if(k=='hide'){LOCK.chat.setHidden(t.checked);syncChips();renderList();toast(t.checked?'Locked chats are hidden':'Locked chats folder is visible')}}

// ── menus ──
$('meb').onclick=()=>settings();$('addb').onclick=addContact;
$('q').value='';   // browsers restore / autofill form fields after reload: always start with an empty search
$('q').oninput=e=>{const q=e.target;if(q.value&&document.activeElement!==q){q.value='';qs='';renderList();return}   // text the browser pasted in by itself (autofill) is not a search
  const raw=q.value.trim();qs=raw.toLowerCase();renderList();clearTimeout(qT);qT=setTimeout(()=>codeCheck(raw),500)};
addEventListener('pageshow',e=>{if(e.persisted&&$('q').value){$('q').value='';qs='';renderList()}});
$('q').addEventListener('keydown',e=>{if(e.key=='Enter'){clearTimeout(qT);codeCheck(e.target.value.trim())}});
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x==b));renderList()});
$('n1').onclick=()=>{if(tab!='chats')setTab('chats');else $('list').scrollTo({top:0,behavior:'smooth'})};$('n4').onclick=()=>setTab('status');$('n5').onclick=()=>setTab('calls');$('n2').onclick=wallpaper;$('n3').onclick=()=>settings();
$('menub').onclick=()=>items([['⚙️ Settings',()=>settings()],['👤 Profile & About',profile],['🔔 Notifications',F.notifOn],['🖼 Wallpaper',wallpaper],['➕ Add contact',addContact],['⎋ Log out',async()=>{await fetch('/api/logout',{method:'POST'});leave()}]]);
$('hav').onclick=()=>{if(cur=='official'){const o=sheet(`<div class="pf">${offAv('big')}<h3 style="margin:0">Lynko Official${VF}</h3><p style="color:var(--mut);text-align:center">Official news and updates from the Lynko team.<br>You can’t reply in this channel.</p></div>`);return}const c=contacts.get(cur);if(!c)return;const o=sheet(`<div class="pf">${av(c,'big')}<h3 style="margin:0"></h3><p style="color:var(--mut);text-align:center"></p><div class="idbox">ID<b>${c.id}</b></div></div>`);
  o.querySelector('h3').textContent=c.username;o.querySelector('p').textContent=c.about||'Hey there! I’m using Lynko';const rb=document.createElement('button');rb.className='btn p';rb.style.width='100%';rb.textContent='✏️ Rename contact';rb.onclick=()=>{o.remove();renameContact(c.id)};o.querySelector('.pf').appendChild(rb)};
$('hmenu').onclick=()=>cur=='ai'?items([['🖼 Wallpaper',wallpaper],['🧹 Clear AI chat',F.aiClear]]):cur=='official'?items([['🖼 Wallpaper',wallpaper]]):items([['✏️ Rename contact',()=>renameContact(cur)],['🖼 Wallpaper',wallpaper],[LOCK.chat.has(cur)?'🔓 Unlock this chat':'🔒 Lock this chat',()=>LOCK.chat.toggle(cur)]]);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)recCancel();
  if(document.hidden&&cur&&LOCK.chat.has(cur)){closeChat()}
  else if(!document.hidden&&cur){pull().catch(()=>{})}});

// ── start ──
(async()=>{
  await LOCK.ready;const pj=sessionStorage.getItem('lynko_priv');if(!pj)return leave();
  let cfg;try{[me,cfg]=await Promise.all([api('/api/me'),api('/api/config')])}catch{return}
  priv=await crypto.subtle.importKey('jwk',JSON.parse(pj),{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
  contacts=new Map(me.contacts.map(c=>[c.id,nick(c)]));paintMe();applyWp();try{renderList()}catch(e){console.error(e)}loadChats().catch(()=>{});loadStatuses().catch(()=>{});loadOfficial().catch(()=>{});
  if(typeof Pusher==='undefined')await new Promise(r=>{const e=$('pjs');if(!e)return r();e.addEventListener('load',r);e.addEventListener('error',r);setTimeout(r,5000)});
  if(typeof Pusher==='undefined')return;   // offline: show saved chats only
  const ps=new Pusher(cfg.key,{cluster:cfg.cluster,channelAuthorization:{endpoint:'/api/pusher/auth'}}),ch=ps.subscribe('private-u-'+me.id);
  ch.bind('msg',async d=>{
    if(d.from==me.id&&d.tmp&&seen.has(d.tmp))return;   // the send call finishes that bubble itself
    const peer=d.from==me.id?d.to:d.from;
    if(!contacts.has(peer)){await loadContacts();keys={}}
    if(!d.ct){peer==cur?pull():loadChats();return}
    const live=peer==cur&&!document.hidden;
    await setLast(peer,d,undefined,true);
    if(live){await addMsg(d,true);if(d.from!=me.id)markRead()}
    else if(d.from!=me.id&&peer!=cur)navigator.vibrate?.(20);
    if(!live&&d.from!=me.id)F.notify(peer,d);renderList()});
  ch.bind('del',d=>{const i=msgs.findIndex(m=>m.id==d.id);if(i>-1)msgs.splice(i,1);$('m'+d.id)?.remove();mcache.forEach((a,k)=>mcache.set(k,a.filter(m=>m.id!=d.id)));loadChats().catch(()=>{})});
  ch.bind('read',d=>{msgs.forEach(m=>{if(m.from==me.id&&m.to==d.by&&!m.r){m.r=true;tickEl($('m'+m.id))}});const c=chats.get(d.by);if(c&&c.m.from==me.id)c.m.r=true;renderList()});
  ch.bind('rx',d=>{setRx(d.id,d.rx);if(d.by!=me.id&&d.rx[d.by]=='❤️'){const r=$('m'+d.id)?.getBoundingClientRect();if(r)burst(r.left+r.width/2,r.top)}});
  ch.bind('typing',F.typingEvent);
  const oc=ps.subscribe('official');
  oc.bind('omsg',d=>{if(off.list.some(m=>m.id==d.id))return;off.list.push(d);
    if(cur=='official'&&!document.hidden){offBubble(d);scrollEnd();markOffRead()}else{off.unread++;if(cur!='official')navigator.vibrate?.(20)}renderList()});
  oc.bind('odel',()=>loadOfficial().catch(()=>{}));
  for(const ev of ['status','sview','sdel'])ch.bind(ev,()=>loadStatuses().catch(()=>{}));
  ch.bind('prof',()=>loadContacts().then(()=>{if(cur)setSub()}).catch(()=>{}));
  let first=1;ps.connection.bind('connected',()=>{if(first){first=0;return}if(cur)pull();loadChats().catch(()=>{});loadStatuses().catch(()=>{});loadOfficial().catch(()=>{})});
  F.init({ps,ch,cfg});
})();
</script>
